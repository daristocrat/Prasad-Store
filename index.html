<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prasad Store is a wholesale grocery and general store in Champasari, Nivedita Road, Siliguri, offering competitive grocery prices, bulk supply, and local delivery."
    />
    <meta name="theme-color" content="#15803d" />
    <title>Prasad Store | Wholesale Grocery Prices in Siliguri</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;font-family:sans-serif;color:#111">' +
          '<h2 style="color:#c2410c">JS Error</h2>' +
          '<pre style="background:#fff7ed;padding:1rem;border-radius:8px;white-space:pre-wrap">' +
          msg + '\n' + src + ':' + line + '\n' + (err && err.stack ? err.stack : '') +
          '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;font-family:sans-serif;color:#111">' +
          '<h2 style="color:#c2410c">Unhandled Promise Error</h2>' +
          '<pre style="background:#fff7ed;padding:1rem;border-radius:8px;white-space:pre-wrap">' +
          (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) +
          '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
